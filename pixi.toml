[workspace]
name = "repo-head-tracking"
version = "0.0.0"
description = "Head tracking mod for R.E.P.O. using CameraUnlock shared library"
channels = ["conda-forge"]
platforms = ["win-64"]

[tasks]
sync = "git submodule update --remote cameraunlock-core"
setup = "powershell -ExecutionPolicy Bypass -File scripts/setup-libs.ps1"
restore = { cmd = "dotnet restore src/REPOHeadTracking/REPOHeadTracking.csproj", depends-on = ["setup"] }
build = { cmd = "dotnet build src/REPOHeadTracking/REPOHeadTracking.csproj -c Release -m:1", depends-on = ["restore"] }
# Checks that every member reference the build emits resolves against the
# assemblies it binds to at runtime. Stub/engine shape drift (a property
# declared as a field, or the reverse) compiles cleanly and only fails in
# game. Needs the game installed; skips and succeeds without it.
verify-refs = { cmd = "powershell -ExecutionPolicy Bypass -File cameraunlock-core/scripts/verify-assembly-refs.ps1 -GameId repo -BuildDir src/REPOHeadTracking/bin/Release", depends-on = ["build"] }
install = { cmd = "powershell -ExecutionPolicy Bypass -File scripts/deploy.ps1 Release", depends-on = ["build"] }
package = { cmd = "powershell -ExecutionPolicy Bypass -File scripts/package-release.ps1", depends-on = ["build"] }
# /y: pixi run allocates no TTY, so uninstall.cmd's pauses would abort the task.
uninstall = "scripts\\uninstall.cmd /y"
clean = "dotnet clean src/REPOHeadTracking/REPOHeadTracking.csproj"
# Bump vendored mod-loader copies to latest upstream within pinned range.
# Manual; commit the result. CI does not run this.
update-deps = "powershell -ExecutionPolicy Bypass -File scripts/update-deps.ps1"
release = "powershell -ExecutionPolicy Bypass -File scripts/release.ps1"
